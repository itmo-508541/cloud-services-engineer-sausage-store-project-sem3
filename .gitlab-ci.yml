variables:
  TF_ROOT: ${CI_PROJECT_DIR}/infra
  OPERATION:
    description: "Select CI/CD-operation"
    value: "terraform"
    options:
      - "terraform"
      - "ansible"
      - "k8s" 
  APPLY:
    description: "Apply infra"
    value: "No"
    options:
      - "No"
      - "Yes"
      - "Destroy"

stages:
  - plan
  - apply
  - destroy

.terraform-job:
  image:
    name: hashicorp/terraform:latest
    entrypoint: [""]
  tags:
    - docker
  before_script:
    - |
      cat << EOF > ~/.terraformrc
      provider_installation {
        network_mirror {
          url = "https://terraform-mirror.yandexcloud.net/"
          include = ["registry.terraform.io/*/*"]
        }
        direct {
          exclude = ["registry.terraform.io/*/*"]
        }
      }
      EOF
    - cd ${TF_ROOT}
    - cp ${YC_SA} ./yandex-sa.json
    - chmod 600 ./yandex-sa.json
  variables:
    TF_VAR_cloud_id: ${YC_CLOUD_ID}
    TF_VAR_folder_id: ${YC_FOLDER_ID}
    TF_VAR_zone: ${YC_ZONE}
    TF_VAR_network_name: ${YC_NETWORK_NAME}
    TF_VAR_ssh_public_key0: ${YC_SSH_PUBLIC_KEY0}

plan:
  extends:
    - .terraform-job
  stage: plan
  script:
    - terraform init
      -backend-config="address=https://cloud-services-engineer.gitlab.yandexcloud.net/api/v4/projects/${CI_PROJECT_ID}/terraform/state/tfstate"
      -backend-config="lock_address=https://cloud-services-engineer.gitlab.yandexcloud.net/api/v4/projects/${CI_PROJECT_ID}/terraform/state/tfstate/lock"
      -backend-config="unlock_address=https://cloud-services-engineer.gitlab.yandexcloud.net/api/v4/projects/${CI_PROJECT_ID}/terraform/state/tfstate/lock"
      -backend-config="lock_method=POST"
      -backend-config="unlock_method=DELETE"
      -backend-config="username=terraform"
      -backend-config="password=${TF_HTTP_PASSWORD}"
      -backend-config="retry_wait_min=5"
    - terraform validate
    - terraform plan -out=tfplan
  rules:
    - if: $OPERATION == "terraform"
      when: always 
  artifacts:
    paths:
      - ${TF_ROOT}/tfplan
      - ${TF_ROOT}/.terraform
    expire_in: 1 day

apply:
  extends:
    - .terraform-job
  stage: apply
  rules:
    - if: $OPERATION == "terraform" && $APPLY == "Yes"
      when: always 
  script:
    - terraform apply -auto-approve
  needs:
    - job: plan
      artifacts: true

destroy:
  extends:
    - .terraform-job
  stage: destroy
  rules:
    - if: $OPERATION == "terraform" && $APPLY == "Destroy"
      when: always 
  script:
    - terraform refresh
    - terraform destroy -auto-approve
  needs:
    - job: plan
      artifacts: true
