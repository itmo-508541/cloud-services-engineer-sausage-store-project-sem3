variables:
  TF_ROOT: ${CI_PROJECT_DIR}/infra
  OPERATION:
    description: "Select CI/CD-operation"
    value: "terraform"
    options:
      - "terraform"
      - "ansible"
      - "k8s" 
  APPLY:
    description: "Apply infra"
    value: "No"
    options:
      - "No"
      - "Yes"
      - "Destroy"

stages:
  - lint
  - checkov
  - plan
  - apply
  - terratest
  - destroy

.terraform-job:
  image:
    name: hashicorp/terraform:latest
    entrypoint: [""]
  tags:
    - docker
  before_script:
    - |
      cat << EOF > ~/.terraformrc
      provider_installation {
        network_mirror {
          url = "https://terraform-mirror.yandexcloud.net/"
          include = ["registry.terraform.io/*/*"]
        }
        direct {
          exclude = ["registry.terraform.io/*/*"]
        }
      }
      EOF
    - cd ${TF_ROOT}
    - echo ${YC_SA} | base64 -d > ./yandex-sa.json
    - chmod 600 ./yandex-sa.json
  variables:
    TF_VAR_cloud_id: ${YC_CLOUD_ID}
    TF_VAR_folder_id: ${YC_FOLDER_ID}
    TF_VAR_zone: ${YC_ZONE}
    TF_VAR_network_name: ${YC_NETWORK_NAME}
    TF_VAR_ssh_public_key0: ${YC_SSH_PUBLIC_KEY0}
    TF_HTTP_ADDRESS: ${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/terraform/state/tfstate
    TF_HTTP_LOCK_ADDRESS: ${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/terraform/state/tfstate/lock
    TF_HTTP_UNLOCK_ADDRESS: ${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/terraform/state/tfstate/lock

fmt:
  extends:
    - .terraform-job
  stage: lint
  script:
    - terraform fmt -check -recursive -diff
  rules:
    - if: $OPERATION == "terraform"
      when: always

checkov:
  stage: checkov
  image:
    name: bridgecrew/checkov:latest
    entrypoint: [""]
  tags:
    - docker
  script:
    - cd ${TF_ROOT}
    - checkov -d . --config-file .checkov.yml
  rules:
    - if: $OPERATION == "terraform"
      when: always

plan:
  extends:
    - .terraform-job
  stage: plan
  script:
    - terraform init
    - terraform validate
    - terraform plan -out=tfplan
  rules:
    - if: $OPERATION == "terraform"
      when: always 
  artifacts:
    paths:
      - ${TF_ROOT}/tfplan
      - ${TF_ROOT}/.terraform
    expire_in: 1 day

apply:
  extends:
    - .terraform-job
  stage: apply
  rules:
    - if: $OPERATION == "terraform" && $APPLY == "Yes"
      when: always 
  script:
    - terraform apply -auto-approve
  needs:
    - job: plan
      artifacts: true

terratest:
  extends:
    - .terraform-job
  stage: terratest
  variables:
    GOTOOLCHAIN: auto
  rules:
    - if: $OPERATION == "terraform" && $APPLY == "Yes"
      when: always
  script:
    - apk add --no-cache go
    - cd test
    - go mod tidy
    - go test -v
  needs:
    - apply
  dependencies:
    - apply
  allow_failure: false

destroy:
  extends:
    - .terraform-job
  stage: destroy
  rules:
    - if: $OPERATION == "terraform" && $APPLY == "Destroy"
      when: always 
  script:
    - terraform refresh
    - terraform destroy -auto-approve
  needs:
    - job: plan
      artifacts: true
