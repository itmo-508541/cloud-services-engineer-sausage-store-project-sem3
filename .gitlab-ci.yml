variables:
  TF_ROOT: ${CI_PROJECT_DIR}/infra
  TF_CLI_CONFIG_FILE: ${TF_ROOT}/.terraformrc
  TF_HTTP_ADDRESS: ${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/terraform/state/tfstate
  TF_HTTP_LOCK_ADDRESS: ${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/terraform/state/tfstate/lock
  TF_HTTP_UNLOCK_ADDRESS: ${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/terraform/state/tfstate/lock

  ANSIBLE_ROOT: ${CI_PROJECT_DIR}/ansible
  ANSIBLE_CONFIG: ${ANSIBLE_ROOT}/ansible.cfg

  OPERATION:
    description: "Select CI/CD-operation"
    value: "terraform"
    options:
      - "terraform"
      - "ansible"
      - "k8s" 
  APPLY:
    description: "Apply infra"
    value: "No"
    options:
      - "No"
      - "Yes"
      - "Destroy"

stages:
  - lint
  - checkov
  - plan
  - apply
  - terratest
  - destroy
  - ansible

global:
  after_script:
    - rm -f ${TF_ROOT}/yandex-sa.*

.yandex-sa:
  before_script: &yandex-sa-script
    - echo ${YC_SA} | base64 -d > ./yandex-sa.json
    - chmod 600 ./yandex-sa.json
    - jq -r '.private_key' ./yandex-sa.json > ./yandex-sa.pem
    - chmod 600 ./yandex-sa.pem
    - ssh-keygen -y -f ./yandex-sa.pem > ./yandex-sa.pub

.terraform-job:
  before_script:
    - cd ${TF_ROOT}
    - *yandex-sa-script
    - export TF_VAR_ssh_public_key1="$(cat ./yandex-sa.pub)"
  variables:
    TF_VAR_cloud_id: ${YC_CLOUD_ID}
    TF_VAR_folder_id: ${YC_FOLDER_ID}
    TF_VAR_zone: ${YC_ZONE}
    TF_VAR_network_name: ${YC_NETWORK_NAME}
    TF_VAR_ssh_public_key0: ${YC_SSH_PUBLIC_KEY0}

fmt:
  extends:
    - .terraform-job
  stage: lint
  script:
    - terraform version
    - terraform fmt -check -recursive -diff
  rules:
    - if: $OPERATION == "terraform"
      when: always

checkov:
  stage: checkov
  script:
    - cd ${TF_ROOT}
    - checkov -d . --config-file .checkov.yml
  rules:
    - if: $OPERATION == "terraform"
      when: always

plan:
  extends:
    - .terraform-job
  stage: plan
  script:
    - terraform init
    - terraform validate
    - terraform plan -out=tfplan
  rules:
    - if: $OPERATION == "terraform"
      when: always 
  artifacts:
    paths:
      - ${TF_ROOT}/tfplan
      - ${TF_ROOT}/.terraform
    expire_in: 1 day

apply:
  extends:
    - .terraform-job
  stage: apply
  rules:
    - if: $OPERATION == "terraform" && $APPLY == "Yes"
      when: always 
  script:
    - terraform apply -auto-approve
  needs:
    - job: plan
      artifacts: true

terratest:
  extends:
    - .terraform-job
  stage: terratest
  variables:
    GOTOOLCHAIN: auto
  rules:
    - if: $OPERATION == "terraform" && $APPLY == "Yes"
      when: always
  script:
    - cd test
    - go mod tidy
    - go test -v
  needs:
    - job: apply
      artifacts: false
  allow_failure: false

destroy:
  extends:
    - .terraform-job
  stage: destroy
  rules:
    - if: $OPERATION == "terraform" && $APPLY == "Destroy"
      when: always 
  script:
    - terraform refresh
    - terraform destroy -auto-approve
  needs:
    - job: plan
      artifacts: true

ansible:
  stage: ansible
  script:
    - cd ${TF_ROOT}
    - *yandex-sa-script
    - terraform init
    - export VM_DEV=$(terraform output -raw vm_dev_address)
    - export VM_PROD=$(terraform output -raw vm_prod_address)
    - cd ${ANSIBLE_ROOT}
    - ansible --version
  rules:
    - if: $OPERATION == "ansible" && $APPLY == "Yes"
      when: always 
